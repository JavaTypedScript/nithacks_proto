<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Site Blocked - Flow Monitor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .icon {
      font-size: 120px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .site-name {
      font-size: 24px;
      margin-bottom: 20px;
      opacity: 0.9;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: inline-block;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.9;
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 16px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 14px;
      opacity: 0.8;
    }

    .actions {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    button {
      padding: 15px 30px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: white;
      color: #667eea;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .motivation {
      margin-top: 30px;
      font-size: 16px;
      font-style: italic;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚫</div>
    <h1>Stay Focused!</h1>
    <div class="site-name" id="siteName">Blocked Site</div>
    <p>This site has been blocked to help you maintain focus and achieve your flow state.</p>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="flowScore">--</div>
        <div class="stat-label">Current Focus</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="tabSwitches">--</div>
        <div class="stat-label">Tab Switches</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="sessionTime">--</div>
        <div class="stat-label">Session Time</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="backToWork">Back to Work</button>
      <button class="btn-secondary" id="allowOnce">Allow Once</button>
    </div>

    <div class="motivation" id="motivation">
      "The secret of getting ahead is getting started." - Mark Twain
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
